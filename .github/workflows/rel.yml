name: release
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Which workflow file is running
        run: |
          echo "WORKFLOW_MARKER=UNREVIEWED_BRANCH_VERSION"
          echo "ref=${{ github.ref }} sha=${{ github.sha }}"
          echo "--- repo content at this ref:"
          cat MARKER.txt
          echo "--- a step that exists ONLY on the unreviewed branch:"
          echo "ARBITRARY_STEP_RAN=yes"
